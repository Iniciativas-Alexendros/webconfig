page: "servicios"
components:
  - id: header-main
    parentId: null
    props:
      cta:
        href: /contacto
        label: Reservar cita
        variant: primary
      logo:
        alt: Clínica Dental Sur
        href: /
        src: assets/brand/logo.svg
      navigation:
        - href: /
          label: Inicio
        - href: /servicios
          label: Servicios
        - href: /contacto
          label: Contacto
    type: header
  - id: hero-servicios
    parentId: null
    props:
      background:
        alt: Gabinete dental moderno
        src: assets/media/images/servicios-hero.jpg
      cta:
        href: /contacto
        label: Pedir cita previa
        variant: primary
      headline: Nuestros Servicios Odontológicos
      subheadline: Tratamientos integrales para toda la familia con la tecnología más avanzada
    type: hero
  - id: implantes-section
    parentId: null
    props:
      level: 2
      text: Implantología Avanzada
    type: heading
  - id: implantes-grid
    parentId: null
    props:
      cards:
        - description: Sustitución de un diente perdido con implante de titanio y corona de zirconio.
          image:
            alt: Implante unitario
            src: assets/media/images/implante-unitario.jpg
          link:
            href: /contacto#implantes
            label: Desde 1.200€
            target: _self
          title: Implante Unitario
        - description: Rehabilitación total con 4 implantes y prótesis fija en 24 horas.
          image:
            alt: All on 4
            src: assets/media/images/all-on-4.jpg
          link:
            href: /contacto#implantes
            label: Desde 8.500€
            target: _self
          title: Arcada Completa (All-on-4)
      columns: 2
    type: card-grid
  - id: ortodoncia-section
    parentId: null
    props:
      level: 2
      text: Ortodoncia
    type: heading
  - id: ortodoncia-grid
    parentId: null
    props:
      cards:
        - description: Alineadores transparentes, removibles y prácticamente invisibles.
          image:
            alt: Alineadores Invisalign
            src: assets/media/images/invisalign.jpg
          link:
            href: /contacto#ortodoncia
            label: Desde 3.200€
            target: _self
          title: Invisalign®
        - description: Brackets de zafiro o cerámica, mucho menos visibles que los metálicos.
          image:
            alt: Brackets de zafiro
            src: assets/media/images/brackets-esteticos.jpg
          link:
            href: /contacto#ortodoncia
            label: Desde 2.800€
            target: _self
          title: Brackets Estéticos
      columns: 2
    type: card-grid
  - id: estetica-section
    parentId: null
    props:
      level: 2
      text: Estética Dental
    type: heading
  - id: estetica-grid
    parentId: null
    props:
      cards:
        - description: Láminas ultrafinas que transforman forma, color y tamaño de los dientes.
          image:
            alt: Carillas de porcelana
            src: assets/media/images/carillas.jpg
          link:
            href: /contacto#estetica
            label: Desde 450€/diente
            target: _self
          title: Carillas de Porcelana
        - description: Blanqueamiento con luz LED en clínica + férulas para casa. Hasta 8 tonos.
          image:
            alt: Blanqueamiento dental
            src: assets/media/images/blanqueamiento.jpg
          link:
            href: /contacto#estetica
            label: 299€
            target: _self
          title: Blanqueamiento Profesional
        - description: Composite de alta estética para fracturas, caries o cerrar espacios.
          image:
            alt: Reconstrucción con composite
            src: assets/media/images/reconstruccion.jpg
          link:
            href: /contacto#estetica
            label: Desde 120€
            target: _self
          title: Reconstrucción Estética
      columns: 3
    type: card-grid
  - id: footer-main
    parentId: null
    props:
      copyright: © 2026 Clínica Dental Sur. Todos los derechos reservados.
      links:
        - href: /aviso-legal
          label: Aviso Legal
        - href: /politica-privacidad
          label: Política de Privacidad
        - href: /contacto
          label: Contacto
      social:
        - href: https://facebook.com/clinicadentalsur
          icon: facebook
          label: Facebook
        - href: https://instagram.com/clinicadentalsur
          icon: instagram
          label: Instagram
    type: footer
