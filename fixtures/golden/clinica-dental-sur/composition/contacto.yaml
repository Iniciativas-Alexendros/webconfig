page: "contacto"
components:
  - id: header-main
    parentId: null
    props:
      cta:
        href: /contacto
        label: Reservar cita
        variant: primary
      logo:
        alt: Clínica Dental Sur
        href: /
        src: assets/brand/logo.svg
      navigation:
        - href: /
          label: Inicio
        - href: /servicios
          label: Servicios
        - href: /contacto
          label: Contacto
    type: header
  - id: hero-contacto
    parentId: null
    props:
      background:
        alt: Recepción de la clínica
        src: assets/media/images/contacto-hero.jpg
      cta:
        href: tel:+34912345678
        label: Llamar ahora
        variant: secondary
      headline: Pide tu Cita
      subheadline: Estamos aquí para ayudarte. Rellena el formulario y te contactaremos en menos de 24h.
    type: hero
  - id: contact-form
    parentId: null
    props:
      fields:
        - label: Nombre completo
          name: nombre
          placeholder: Juan Pérez
          required: true
          type: text
        - label: Email
          name: email
          placeholder: juan@ejemplo.com
          required: true
          type: email
        - label: Teléfono
          name: telefono
          placeholder: +34 600 000 000
          required: true
          type: tel
        - label: Servicio de interés
          name: servicio
          options:
            - label: Implantología
              value: implantes
            - label: Ortodoncia
              value: ortodoncia
            - label: Estética Dental
              value: estetica
            - label: Odontología General
              value: general
            - label: Urgencia
              value: urgencia
          required: false
          type: select
        - label: Mensaje / Síntomas
          name: mensaje
          placeholder: Cuéntanos qué necesitas...
          required: false
          type: textarea
      submitLabel: Enviar solicitud
      successMessage: ¡Gracias! Te contactaremos en menos de 24 horas para confirmar tu cita.
    type: contact-form
  - id: info-contacto
    parentId: null
    props:
      items:
        - icon: map-pin
          text: Calle Mayor, 45 - 28013 Madrid
        - icon: phone
          text: +34 912 345 678
        - icon: mail
          text: info@clinicadentalsur.es
        - icon: clock
          text: "L-V: 9:00-20:00 | S: 9:00-14:00"
    type: icon-list
  - id: map-placeholder
    parentId: null
    props:
      alt: Mapa de ubicación de Clínica Dental Sur
      caption: Nuestra clínica en el centro de Madrid
      src: assets/media/images/mapa-clinica.jpg
    type: image
  - id: footer-main
    parentId: null
    props:
      copyright: © 2026 Clínica Dental Sur. Todos los derechos reservados.
      links:
        - href: /aviso-legal
          label: Aviso Legal
        - href: /politica-privacidad
          label: Política de Privacidad
        - href: /contacto
          label: Contacto
      social:
        - href: https://facebook.com/clinicadentalsur
          icon: facebook
          label: Facebook
        - href: https://instagram.com/clinicadentalsur
          icon: instagram
          label: Instagram
    type: footer
