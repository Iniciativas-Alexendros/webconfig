name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tokens contrast + DS coverage
        run: npm run tokens:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage gate
        run: npm test -- --coverage

      - name: Verify fixture coverage and trigger codes
        run: npm run verify:fixtures

      - name: Validate golden fixture with --json
        run: |
          node dist/cli.js validate fixtures/golden/clinica-dental-sur --ds ds-catalog.example.yaml --json | jq -e '(.valid == true) and (.errors | length == 0) and ([.warnings[] | select(.code != "I18N_002")] | length == 0)'

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Check generated tokens committed
        run: |
          git status --porcelain -- dist-tokens/ showcase/src/styles/generated-tokens.css > /tmp/ds-drift.txt || true
          if grep -q . /tmp/ds-drift.txt; then echo "Tokens regenerados difieren del commit" && cat /tmp/ds-drift.txt && exit 1; fi
          echo "Tokens generados al día"

      - name: Build CLI
        run: npm run build

      - name: Build showcase
        run: npm run ds:build

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: webconfig-cli
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: webconfig-cli
          path: dist/

      - name: CLI help
        run: node dist/cli.js --help

      - name: Validate golden fixture
        run: node dist/cli.js validate fixtures/golden/clinica-dental-sur --ds ds-catalog.example.yaml

      - name: Normalize check golden fixture
        run: node dist/cli.js normalize fixtures/golden/clinica-dental-sur --check

      - name: Export deterministic test
        run: |
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/test1.tar.gz
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/test2.tar.gz
          sha256sum /tmp/test1.tar.gz /tmp/test2.tar.gz | awk '{print $1}' | sort -u | wc -l | grep -q '^1$' && echo "Exports are deterministic"

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E + visual showcase
        run: npx playwright test
