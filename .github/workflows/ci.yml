name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build CLI
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Coverage
        run: npm test -- --coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate golden fixture
        run: node dist/cli.js validate fixtures/golden/clinica-dental-sur --ds ds-catalog.example.yaml

      - name: Normalize check golden fixture
        run: node dist/cli.js normalize fixtures/golden/clinica-dental-sur --check

      - name: Export deterministic test
        run: |
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/test1.tar.gz
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/test2.tar.gz
          sha256sum /tmp/test1.tar.gz /tmp/test2.tar.gz | awk '{print $1}' | sort -u | wc -l | grep -q '^1$' && echo "Exports are deterministic"

  ds-and-showcase:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Check contrast + DS coverage
        run: npm run tokens:check

      - name: Check generated tokens committed
        run: |
          git status --porcelain -- dist-tokens/ showcase/src/styles/generated-tokens.css > /tmp/ds-drift.txt || true
          if grep -q . /tmp/ds-drift.txt; then echo "Tokens regenerados difieren del commit" && cat /tmp/ds-drift.txt && exit 1; fi
          echo "Tokens generados al día"

      - name: Typecheck all
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Build CLI
        run: npm run build

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E + visual showcase
        run: npx playwright test

      - name: Build showcase
        run: npm run ds:build

      - name: Verify DS coverage
        run: npm run verify:ds

  validate-all-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Verify fixture coverage and trigger codes
        run: node scripts/verify-fixture-coverage.mjs

      - name: Validate golden fixture with --json
        run: |
          node dist/cli.js validate fixtures/golden/clinica-dental-sur --ds ds-catalog.example.yaml --json | jq -e '(.valid == true) and (.errors | length == 0) and ([.warnings[] | select(.code != "I18N_002")] | length == 0)'