name: Release Validation

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to validate (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build CLI
        run: npm run build
      
      - name: Typecheck
        run: npm run typecheck
      
      - name: Run full test suite
        run: npm test
      
      - name: Validate golden fixture
        run: node dist/cli.js validate fixtures/golden/clinica-dental-sur --ds ds-catalog.example.yaml --json | jq -e '.valid == true'
      
      - name: Validate all invalid fixtures
        run: |
          set +e
          for dir in fixtures/invalid/*/; do
            code=$(basename "$dir")
            echo "Validating $dir (expect $code)..."
            output=$(node dist/cli.js validate "$dir" --ds ds-catalog.example.yaml 2>&1)
            if ! echo "$output" | grep -q "\[$code\]"; then
              echo "FAIL: $dir did not trigger expected code $code"
              echo "$output"
              exit 1
            fi
          done
          echo "All invalid fixtures correctly flagged"
      
      - name: Export and validate deterministic output
        run: |
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/rel1.tar.gz
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/rel2.tar.gz
          sha256sum /tmp/rel1.tar.gz /tmp/rel2.tar.gz | awk '{print $1}' | sort -u | wc -l | grep -q '^1$' && echo "Release exports are deterministic"
      
      - name: Normalize idempotency check
        run: node dist/cli.js normalize fixtures/golden/clinica-dental-sur --check
      
      - name: Verify version consistency
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG=${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
          RELEASE_VERSION=${RELEASE_TAG#v}
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch: package.json=$PACKAGE_VERSION, tag=$RELEASE_VERSION"
            exit 1
          fi
          echo "Version consistent: $PACKAGE_VERSION"
      
      - name: Verify no secrets in codebase
        run: |
          node dist/cli.js validate . --ds ds-catalog.example.yaml --json 2>&1 | jq -e '.errors | map(select(.code == "SECRET_001")) | length == 0'
          echo "No secrets detected"

  publish-assets:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build CLI
        run: npm run build
      
      - name: Create release tarball
        run: |
          node dist/cli.js export fixtures/golden/clinica-dental-sur /tmp/webconfig-${{ github.event.release.tag_name }}.tar.gz
      
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: /tmp/webconfig-${{ github.event.release.tag_name }}.tar.gz
          asset_name: webconfig-${{ github.event.release.tag_name }}.tar.gz
          asset_content_type: application/gzip